/* ============ Квест Первых · Совет Первых Чувашской Республики ============ */
:root {
  --blue: #1b3f8f;
  --blue-2: #2b5ab8;
  --blue-deep: #14306e;
  --blue-soft: #e8effb;
  --blue-line: #cfddf3;
  --red: #e4232f;
  --red-dark: #c3151f;
  --red-soft: #fdecee;
  --green: #12805c;
  --green-soft: #e7f6ef;
  --gold: #f2b742;
  --text: #12203f;
  --muted: #5a6b8e;
  --bg: #f5f8fd;
  --card: #ffffff;
  --line: #dde7f6;
  --line-hard: #c3d3ec;
  --radius: 18px;
  --shadow: 0 8px 24px rgba(20, 48, 110, .07);
  --shadow-lg: 0 22px 50px rgba(20, 48, 110, .14);
  --mono: "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.15; letter-spacing: -.01em; }
p { margin: 0; }
button, input { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }

:focus-visible { outline: 3px solid rgba(43, 90, 184, .5); outline-offset: 2px; }

/* ---------- орнамент ---------- */
.ornament {
  height: 14px;
  background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='30' height='14'%3E%3Cpath d='M15 2l6 5-6 5-6-5z' fill='none' stroke='%23E4232F' stroke-width='1.3'/%3E%3C/svg%3E");
  background-repeat: repeat-x;
  background-position: center;
  opacity: .85;
}

/* ---------- шапка ---------- */
.top {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 6px clamp(14px, 4vw, 40px);
  background: rgba(255, 255, 255, .95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; flex: none; }

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  flex: none;
}

.brand-mark svg { width: 100%; height: 100%; }

.brand-name {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
  font-weight: 800;
  font-size: 15.5px;
  text-transform: uppercase;
  letter-spacing: .02em;
}

.brand-name small {
  font-weight: 500;
  font-size: 10.5px;
  color: var(--muted);
  text-transform: none;
  letter-spacing: 0;
  margin-top: 2px;
}

/* ---------- шаги ---------- */
.steps { display: flex; align-items: center; gap: 6px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.steps::-webkit-scrollbar { display: none; }

.step {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px 7px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--blue);
  font-size: 12.5px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: all .16s;
}

.step .num {
  width: 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 11.5px;
  font-weight: 800;
  flex: none;
}

.step:hover { border-color: var(--blue-line); transform: translateY(-1px); }
.step.active { background: var(--blue); border-color: var(--blue); color: #fff; }
.step.active .num { background: rgba(255, 255, 255, .2); color: #fff; }
.step.done { border-color: var(--blue-line); background: var(--blue-soft); color: var(--blue-deep); }
.step.done .num { background: var(--blue); color: #fff; }
.step.locked { opacity: .5; cursor: not-allowed; }
.step.locked:hover { transform: none; }

/* ---------- кнопки ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border: 1px solid transparent;
  border-radius: 12px;
  background: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  text-decoration: none;
  transition: transform .08s, box-shadow .16s, background .16s, border-color .16s;
}

.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; }

.btn-primary { background: var(--blue); color: #fff; box-shadow: 0 8px 20px rgba(27, 63, 143, .25); }
.btn-primary:hover { background: var(--blue-deep); box-shadow: 0 12px 26px rgba(27, 63, 143, .3); }

.btn-accent { background: var(--red); color: #fff; box-shadow: 0 8px 20px rgba(228, 35, 47, .25); }
.btn-accent:hover { background: var(--red-dark); box-shadow: 0 12px 26px rgba(228, 35, 47, .32); }

.btn-ghost { background: #fff; border-color: var(--line-hard); color: var(--blue); }
.btn-ghost:hover { border-color: var(--blue); background: var(--blue-soft); }

.btn-sm { padding: 8px 14px; font-size: 12.5px; border-radius: 10px; }
.btn-lg { padding: 15px 28px; font-size: 15.5px; }
.btn-block { width: 100%; }

/* ---------- контейнер ---------- */
.app {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: clamp(18px, 3vw, 32px) clamp(14px, 4vw, 40px) 56px;
}

.foot {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  justify-content: space-between;
  padding: 22px clamp(14px, 4vw, 40px);
  background: var(--blue);
  color: rgba(255, 255, 255, .82);
  font-size: 12.5px;
  border-top: 4px solid var(--red);
}

.foot > span { max-width: 1200px; }

/* ---------- карточки ---------- */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  padding: 16px 22px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #fbfdff, #fff);
  border-radius: var(--radius) var(--radius) 0 0;
}

.card-head h2 { font-size: 15.5px; text-transform: uppercase; letter-spacing: .03em; color: var(--blue); }
.card-body { padding: 22px; }
.hint { color: var(--muted); font-size: 12.5px; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: clamp(26px, 4vw, 44px);
  border-radius: 24px;
  background: linear-gradient(128deg, var(--blue-deep) 0%, var(--blue) 55%, var(--blue-2) 100%);
  color: #fff;
  box-shadow: var(--shadow-lg);
}

.hero::after {
  content: "";
  position: absolute;
  width: 520px;
  height: 520px;
  right: -180px;
  top: -200px;
  border-radius: 50%;
  border: 60px solid rgba(255, 255, 255, .06);
  pointer-events: none;
}

.hero::before {
  content: "";
  position: absolute;
  right: -60px;
  bottom: -120px;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(228, 35, 47, .5), transparent 65%);
  pointer-events: none;
}

.hero > * { position: relative; z-index: 1; }

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .38);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.hero h1 {
  margin: 14px 0 12px;
  font-size: clamp(26px, 4.6vw, 46px);
  font-weight: 800;
  letter-spacing: .01em;
  text-transform: uppercase;
  max-width: 20ch;
}

.hero p.lead { max-width: 58ch; font-size: clamp(14.5px, 1.5vw, 16.5px); color: rgba(255, 255, 255, .92); }

.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
.hero .btn-primary { background: #fff; color: var(--blue-deep); box-shadow: 0 10px 26px rgba(0, 0, 0, .18); }
.hero .btn-primary:hover { background: #f2f6ff; }
.hero .btn-ghost { background: transparent; border-color: rgba(255, 255, 255, .55); color: #fff; }
.hero .btn-ghost:hover { background: rgba(255, 255, 255, .14); }

.hero-meta { display: flex; flex-wrap: wrap; gap: 10px 30px; margin-top: 26px; font-size: 12.5px; color: rgba(255, 255, 255, .88); }
.hero-meta b { display: block; font-size: 22px; font-weight: 800; color: #fff; }

.hero-motto {
  margin-top: 18px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, .75);
}

/* ---------- карта ---------- */
.map-fig {
  display: grid;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  gap: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.map-fig img { width: 100%; height: 100%; object-fit: cover; }

.map-fig .map-body { padding: 24px; display: flex; flex-direction: column; justify-content: center; gap: 10px; border-left: 1px solid var(--line); }
.map-fig h3 { font-size: 19px; text-transform: uppercase; letter-spacing: .02em; color: var(--blue); }
.map-fig p { color: var(--muted); font-size: 13.5px; }

.facts { display: flex; gap: 26px; margin-top: 6px; }
.facts div b { display: block; font-size: 28px; font-weight: 800; color: var(--red); line-height: 1.1; }
.facts div span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* ---------- сетки ---------- */
.grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.section-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
.section-title h2 { font-size: 17px; text-transform: uppercase; letter-spacing: .04em; color: var(--blue); }
.section-title span { color: var(--muted); font-size: 12.5px; }

/* ---------- этапы на старте ---------- */
.stage-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 20px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform .16s, box-shadow .16s;
}

.stage-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }

.stage-card .num {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--blue);
  color: #fff;
  font-weight: 800;
  font-size: 15px;
}

.stage-card h3 { font-size: 15.5px; }
.stage-card p { color: var(--muted); font-size: 13px; }
.stage-card .foot-row { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.state { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.state.ok { color: var(--green); }
.state.now { color: var(--red); }
.state.wait { color: var(--muted); }

/* ---------- площадки ---------- */
.platforms { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }

.platform {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
}

.platform .ico {
  width: 30px;
  height: 30px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
}

.platform b { display: block; font-size: 13.5px; }
.platform span { color: var(--muted); font-size: 12px; }

/* ---------- игра ---------- */
.ladder { display: flex; flex-direction: column; gap: 9px; }

.slot {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 70px;
  padding: 12px 16px;
  border: 2px dashed var(--line-hard);
  border-radius: 14px;
  background: #fbfdff;
  text-align: left;
  width: 100%;
  cursor: pointer;
  transition: border-color .16s, background .16s;
}

.slot:hover { border-color: var(--blue-2); background: var(--blue-soft); }

.slot .slot-n {
  width: 32px;
  height: 32px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--blue-line);
  color: var(--blue);
  font-size: 13px;
  font-weight: 800;
}

.slot .slot-body { display: flex; flex-direction: column; gap: 1px; }
.slot .slot-title { font-weight: 700; font-size: 14.5px; }
.slot .slot-sub { font-size: 12px; color: var(--muted); }
.slot.filled { border-style: solid; border-color: var(--blue); background: var(--blue-soft); cursor: default; }
.slot.filled .slot-n { background: var(--blue); border-color: var(--blue); color: #fff; }
.slot.wrong { border-color: var(--red); background: var(--red-soft); animation: shake .34s; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}

.bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 9px; }

.bank-card {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 14px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
  text-align: left;
  cursor: pointer;
  transition: all .14s;
  font-weight: 700;
  font-size: 13.5px;
}

.bank-card small { font-weight: 500; color: var(--muted); font-size: 11.5px; }
.bank-card:hover { border-color: var(--blue-2); transform: translateY(-2px); }
.bank-card.sel { border-color: var(--red); box-shadow: 0 0 0 4px rgba(228, 35, 47, .12); }
.bank-card.gone { display: none; }

/* ---------- обратная связь ---------- */
.feedback {
  padding: 11px 15px;
  border-radius: 12px;
  font-size: 13.5px;
  font-weight: 600;
  display: none;
}

.feedback.show { display: block; }
.feedback.ok { background: var(--green-soft); color: var(--green); border: 1px solid rgba(18, 128, 92, .25); }
.feedback.bad { background: var(--red-soft); color: var(--red-dark); border: 1px solid rgba(228, 35, 47, .25); }
.feedback.info { background: var(--blue-soft); color: var(--blue-deep); border: 1px solid var(--blue-line); }

/* ---------- роли ---------- */
.clues { display: grid; gap: 9px; }

.clue {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  padding: 14px 16px;
  border: 2px dashed var(--line-hard);
  border-radius: 14px;
  background: #fbfdff;
}

.clue p { flex: 1 1 260px; font-size: 13.5px; color: var(--muted); }
.clue.filled { border-style: solid; border-color: var(--blue); background: var(--blue-soft); }

.drop {
  min-width: 200px;
  padding: 9px 14px;
  border: 1px solid var(--line-hard);
  border-radius: 10px;
  background: #fff;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  text-align: center;
}

.drop:hover { border-color: var(--blue); color: var(--blue); }
.clue.filled .drop { border-color: transparent; background: transparent; color: var(--blue-deep); cursor: default; }

.role-bank { display: flex; flex-wrap: wrap; gap: 8px; }

.role-chip {
  padding: 9px 15px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: #fff;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .14s;
}

.role-chip:hover { border-color: var(--blue-2); }
.role-chip.sel { border-color: var(--red); background: var(--red-soft); color: var(--red-dark); }
.role-chip.gone { display: none; }

/* ---------- тест ---------- */
.quiz-progress { display: flex; flex-direction: column; gap: 8px; }
.bar { height: 8px; border-radius: 999px; background: var(--blue-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--red)); transition: width .3s ease; }

.q-title { font-size: clamp(19px, 2.8vw, 25px); margin: 4px 0 16px; }

.options { display: grid; gap: 9px; }

.option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--line);
  border-radius: 12px;
  background: #fff;
  text-align: left;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all .14s;
}

.option:hover { border-color: var(--blue); transform: translateX(3px); }

.option .key {
  width: 26px;
  height: 26px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
}

.option.ok { border-color: var(--green); background: var(--green-soft); }
.option.bad { border-color: var(--red); background: var(--red-soft); }

/* ---------- результат ---------- */
.result-top {
  position: relative;
  overflow: hidden;
  padding: 26px;
  border-radius: 20px;
  color: #fff;
  background: linear-gradient(135deg, var(--blue-deep), var(--blue-2));
}

.result-top .slogan { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
.result-top h2 { font-size: clamp(24px, 3.6vw, 34px); margin: 6px 0 10px; text-transform: uppercase; }
.result-top p { color: rgba(255, 255, 255, .9); max-width: 58ch; font-size: 14px; }

.result-alt { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.alt-card { padding: 15px 17px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
.alt-card b { display: block; font-size: 14px; }
.alt-card span { color: var(--muted); font-size: 12px; }

.bullets { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 0; padding-left: 18px; font-size: 13.5px; }

/* ---------- коллаж ---------- */
.stations-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }

.station-card { display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; box-shadow: var(--shadow); }
.station-card h3 { font-size: 13.5px; color: var(--blue); }
.station-card .station-hint { font-size: 11.5px; color: var(--muted); margin-top: -4px; }

.dropzone {
  position: relative;
  display: grid;
  place-items: center;
  gap: 2px;
  min-height: 84px;
  padding: 10px;
  border: 2px dashed var(--line-hard);
  border-radius: 12px;
  background: #fbfdff;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  cursor: pointer;
  transition: all .15s;
}

.dropzone:hover, .dropzone.over { border-color: var(--blue-2); background: var(--blue-soft); color: var(--blue); }
.dropzone b { color: var(--blue); font-size: 12.5px; }
.dropzone input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 5px; }
.thumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--blue-soft); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }

.thumb button {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: rgba(18, 32, 63, .8);
  color: #fff;
  font-size: 12px;
  line-height: 1;
  cursor: pointer;
}

.collage-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 390px); gap: 18px; align-items: start; }

.field-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 6px; }

.style-row { display: flex; gap: 8px; flex-wrap: wrap; }

.style-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  border: 2px solid var(--line);
  border-radius: 999px;
  background: #fff;
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
}

.style-chip .swatch { width: 15px; height: 15px; border-radius: 50%; border: 1px solid rgba(0, 0, 0, .12); }
.style-chip.sel { border-color: var(--blue); background: var(--blue-soft); color: var(--blue-deep); }

.preview { position: sticky; top: 76px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: #fff; box-shadow: var(--shadow); }
.preview-img { border-radius: 12px; overflow: hidden; background: var(--blue-soft); min-height: 220px; display: grid; place-items: center; }
.preview-img img { width: 100%; height: auto; }
.preview-empty { text-align: center; color: var(--muted); font-size: 12.5px; padding: 40px 16px; }
.preview-actions { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }

/* ---------- финал ---------- */
.finish-hero { text-align: center; padding: 38px 22px; }
.finish-hero h1 { font-size: clamp(26px, 4.4vw, 40px); margin: 10px 0; text-transform: uppercase; color: var(--blue); }
.finish-hero p { color: var(--muted); max-width: 54ch; margin: 0 auto; }

.reward {
  margin: 22px auto 0;
  max-width: 440px;
  padding: 20px;
  border: 2px dashed var(--gold);
  border-radius: 16px;
  background: linear-gradient(180deg, #fffdf5, #fff7e6);
}

.reward .pill { background: rgba(242, 183, 66, .22); color: #8a5a00; }

.reward .code {
  font-family: var(--mono);
  font-size: clamp(22px, 4.4vw, 30px);
  font-weight: 800;
  letter-spacing: .1em;
  color: var(--red-dark);
  margin: 6px 0 4px;
}

.checklist { display: flex; flex-direction: column; gap: 9px; margin: 20px auto 0; text-align: left; max-width: 440px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; }
.check .tick { flex: none; width: 21px; height: 21px; display: grid; place-items: center; border-radius: 50%; background: var(--blue); color: #fff; font-size: 11px; font-weight: 800; }

/* ---------- прочее ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  background: var(--blue-soft);
  color: var(--blue);
  font-size: 11.5px;
  font-weight: 700;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 90;
  max-width: min(520px, calc(100vw - 32px));
  padding: 12px 20px;
  border-radius: 12px;
  background: var(--blue-deep);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 18px 40px rgba(20, 48, 110, .35);
  transform: translate(-50%, 18px);
  opacity: 0;
  visibility: hidden;
  transition: all .22s ease;
  text-align: center;
}

.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }

.confetti-piece { position: fixed; top: -14px; z-index: 5; pointer-events: none; border-radius: 2px; animation-name: fall; animation-timing-function: linear; animation-fill-mode: forwards; }

@keyframes fall {
  to { transform: translateY(106vh) rotate(720deg); opacity: .15; }
}

.muted { color: var(--muted); }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.grow { flex: 1 1 auto; }

/* ---------- адаптив ---------- */
@media (max-width: 900px) {
  .top { flex-wrap: wrap; gap: 8px; }
  .steps { order: 3; flex-basis: 100%; margin-left: 0; }
  .brand-name small { display: none; }
  .collage-layout { grid-template-columns: 1fr; }
  .preview { position: static; }
  .top .btn-ghost { margin-left: auto; }
  .map-fig { grid-template-columns: 1fr; }
  .map-fig .map-body { border-left: 0; border-top: 1px solid var(--line); }
}

@media (max-width: 560px) {
  body { font-size: 14.5px; }
  .hero { border-radius: 18px; padding: 22px 18px; }
  .card-head, .card-body { padding-left: 16px; padding-right: 16px; }
  .slot { min-height: 62px; padding: 10px 12px; gap: 10px; }
  .clue { padding: 12px; }
  .drop { min-width: 100%; }
  .btn-lg { width: 100%; }
  .hero-actions { flex-direction: column; align-items: stretch; }
  .facts { gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}

/* ============ логотип, отделение, статистика ============ */
.brand-logo { height: 58px; width: auto; display: block; }

.foot-link { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
.foot-link:hover { opacity: .85; }

.place-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 24px; align-items: center; }
.place-art img { width: 100%; height: auto; max-height: 300px; object-fit: contain; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field select, .field input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--line-hard);
  border-radius: 10px;
  background: #fff;
  font-size: 14px;
  outline: none;
}
.field select:focus, .field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(43, 90, 184, .15); }
.field small { color: var(--muted); font-size: 11.5px; }

.notice { padding: 14px 16px; border-radius: 12px; background: var(--blue-soft); border: 1px solid var(--blue-line); color: var(--blue-deep); font-size: 13.5px; }
.notice.bad { background: var(--red-soft); border-color: rgba(228, 35, 47, .3); color: var(--red-dark); }

.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kpi { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); text-align: center; }
.kpi b { display: block; font-size: 30px; color: var(--blue); line-height: 1.1; }
.kpi span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.stat-block h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--blue); margin-bottom: 10px; }
.stat-row { display: grid; grid-template-columns: minmax(120px, 210px) 1fr 44px; align-items: center; gap: 10px; font-size: 13px; padding: 4px 0; }
.stat-name { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stat-bar { height: 10px; border-radius: 999px; background: var(--blue-soft); overflow: hidden; }
.stat-bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--red)); }
.stat-count { text-align: right; color: var(--blue); }

.table-wrap { overflow-x: auto; }
.table-wrap table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.table-wrap th { text-align: left; padding: 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); }
.table-wrap td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
.table-wrap .num { text-align: right; }

@media (max-width: 860px) {
  .place-grid { grid-template-columns: 1fr; }
  .place-art { display: none; }
  .brand-logo { height: 42px; }
}

</style>

  <script>
/* Прогресс квеста, профиль участника и фото. */
window.Store = (function () {
  "use strict";

  var KEY = "quest-first-v1";

  function defaults() {
    return {
      game: { step: 1, tasks: [false, false, false], done: false },
      quiz: { done: false, result: null, answers: [] },
      collage: { done: false, format: "45", style: "paper" },
      profile: { district: "", school: "" },
      submitted: false,
      code: null
    };
  }

  function load() {
    var base = defaults();
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return base;
      var p = JSON.parse(raw);
      return {
        game: Object.assign({}, base.game, p.game || {}),
        quiz: Object.assign({}, base.quiz, p.quiz || {}),
        collage: Object.assign({}, base.collage, p.collage || {}),
        profile: Object.assign({}, base.profile, p.profile || {}),
        submitted: !!p.submitted,
        code: p.code || null
      };
    } catch (e) {
      return base;
    }
  }

  var state = load();

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      /* приватный режим — просто живём без сохранения */
    }
  }

  var api = {
    get state() {
      return state;
    },
    save: save,
    reset: function () {
      state = defaults();
      save();
    },
    isUnlocked: function (stage) {
      if (stage === 1) return true;
      if (stage === 2) return state.game.done;
      if (stage === 3) return state.quiz.done;
      return state.game.done && state.quiz.done && state.collage.done;
    },
    allDone: function () {
      return state.game.done && state.quiz.done && state.collage.done;
    },
    setPlace: function (district, school) {
      state.profile = { district: district, school: school };
      save();
    },
    ensureCode: function () {
      if (!state.code) {
        state.code = "ПЕРВЫЕ-" + String(Math.floor(1000 + Math.random() * 9000));
        save();
      }
      return state.code;
    }
  };

  window.Store = api;

  /* ---- IndexedDB для фото (может быть недоступен на file://) ---- */
  var DB_NAME = "quest-photos-v1";
  var STORE = "photos";
  var dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      if (!window.indexedDB) return reject(new Error("no idb"));
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }

  function tx(mode, fn) {
    return openDB().then(function (db) {
      return new Promise(function (resolve, reject) {
        var t = db.transaction(STORE, mode);
        var store = t.objectStore(STORE);
        var out = fn(store);
        t.oncomplete = function () { resolve(out && out.result !== undefined ? out.result : out); };
        t.onerror = function () { reject(t.error); };
        t.onabort = function () { reject(t.error); };
      });
    });
  }

  window.PhotoDB = {
    available: false,
    load: function () {
      return openDB()
        .then(function (db) {
          return new Promise(function (resolve, reject) {
            var t = db.transaction(STORE, "readonly");
            var s = t.objectStore(STORE);
            var rows = [];
            var req = s.openCursor();
            req.onsuccess = function () {
              var cur = req.result;
              if (cur) {
                rows.push({ key: cur.key, value: cur.value });
                cur.continue();
              }
            };
            t.oncomplete = function () {
              window.PhotoDB.available = true;
              resolve(rows);
            };
            t.onerror = function () { reject(t.error); };
          });
        })
        .catch(function () { return []; });
    },
    put: function (map) {
      if (!window.PhotoDB.available) return Promise.resolve();
      return tx("readwrite", function (s) {
        s.clear();
        map.forEach(function (blobs, station) {
          s.put(blobs, station);
        });
      }).catch(function () {});
    },
    clear: function () {
      if (!window.PhotoDB.available) return Promise.resolve();
      return tx("readwrite", function (s) { s.clear(); }).catch(function () {});
    }
  };

  return api;
})();

</script>

/* Клиент публичной статистики. Работает через Supabase REST, если указаны url и key.
   Пока не настроено — статистика показывает демо-данные. */
window.API = (function () {
  "use strict";

  var cfg = (window.DATA && window.DATA.stats) || {};
  var table = cfg.table || "participants";
  var base = String(cfg.url || "").replace(/\/+$/, "");

  var enabled = !!(base && cfg.key);

  function headers() {
    return {
      apikey: cfg.key,
      Authorization: "Bearer " + cfg.key,
      "Content-Type": "application/json"
    };
  }

  function submit(record) {
    if (!enabled) return Promise.reject(new Error("stats-offline"));
    return fetch(base + "/rest/v1/" + table, {
      method: "POST",
      headers: Object.assign(headers(), { Prefer: "return=minimal" }),
      body: JSON.stringify(record)
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return true;
    });
  }

  function rows() {
    if (!enabled) return Promise.resolve(demoRows());
    return fetch(base + "/rest/v1/" + table + "?select=district,school,direction,created_at&limit=5000", {
      headers: headers()
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    });
  }

  /* Демонстрационные данные: стабильные, без случайности при каждом открытии. */
  function demoRows() {
    var sample = [
      ["Чебоксары", "СОШ № 12", "media", 7],

  <script>
/* ЭТАП 1 — игра «Как устроены Советы Первых» */
(function () {
  "use strict";

  var S = window.Store;
  var D = window.DATA;

  var placed = {};        // уровень n -> поставлен
  var placedRoles = {};   // id роли -> сопоставлена
  var picked = null;      // {kind, id}
  var fb = { type: "", text: "" };
  var bankOrder = null;
  var timer = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function fbHtml() {
    if (!fb.text) return '<div class="feedback" id="fb" aria-live="polite"></div>';

  function stepDots(step) {
    var out = "";
    for (var i = 1; i <= 3; i++) {
      var cls = i < step ? "done" : i === step ? "now" : "";
      out += '<span class="pill" style="opacity:' + (i <= step ? 1 : .55) + '">' +
        (i < step ? "✓ " : "") + "задание " + i + "</span>";
    }
    return out;
  }

  /* ---------- задание 1 ---------- */
  function task1() {
    var slots = "";
    [4, 3, 2, 1].forEach(function (n) {
      var lvl = D.levels[n - 1];
      if (placed[n]) {
        slots +=
          '<div class="slot filled">' +
          '<span class="slot-n">✓</span>' +
          '<span class="slot-body">' +
          '<span class="slot-title">' + esc(lvl.name) + "</span>" +
          '<span class="slot-sub">' + esc(lvl.tag) + "</span>" +
          "</span></div>";
      } else {
        slots +=
          '<button type="button" class="slot" data-act="slot-level" data-n="' + n + '">' +
          '<span class="slot-n">' + n + "</span>" +
          '<span class="slot-body">' +
          '<span class="slot-title muted">Уровень ' + n + "</span>" +
          '<span class="slot-sub">нажми сюда, чтобы поставить карточку</span>' +
          "</span></button>";
      }
    });

    if (!bankOrder) bankOrder = shuffle(D.levels.map(function (l) { return l.id; }));

    var bank = bankOrder.map(function (id) {
      var lvl = D.levels.filter(function (l) { return l.id === id; })[0];
      var gone = placed[lvl.n];
      var sel = picked && picked.kind === "level" && picked.id === id;
      return (
        '<button type="button" class="bank-card' + (sel ? " sel" : "") + (gone ? " gone" : "") +
        '" data-act="pick-level" data-id="' + id + '">' +
        esc(lvl.name) + "<small>" + esc(lvl.tag) + "</small></button>"
      );
    }).join("");

    return (
      '<div class="card">' +
      '<div class="card-head"><h2>Задание 1 из 3 · Лестница уровней</h2>' +
      '<span class="hint">Нажми карточку, потом ступень</span></div>' +
      '<div class="card-body stack">' +
      '<p class="muted">Снизу — твоя школа, сверху — вся страна. Расставь уровни Советов Первых по порядку.</p>' +
      '<div class="ladder">' + slots + "</div>" +
      fbHtml() +
      '<div><div class="field-label">Карточки уровней</div><div class="bank">' + bank + "</div></div>" +
      '<p class="hint">Подсказка: первичное отделение — самая первая ступень, с неё всё начинается.</p>' +
      "</div></div>"
    );
  }

  /* ---------- задание 2 ---------- */
  function task2() {
    var clues = D.roles.map(function (r) {
      var done = placedRoles[r.id];
      var isPicked = picked && picked.kind === "role" && picked.id === r.id;

      if (done) {
        return (
          '<div class="clue filled">' +
          "<p>" + esc(r.clue) + "</p>" +
          '<span class="drop" style="cursor:default">✓ ' + esc(r.name) + "</span>" +
          "</div>"
        );
      }
      return (
        '<div class="clue" data-slot="' + r.id + '">' +
        "<p>" + esc(r.clue) + "</p>" +
        '<button type="button" class="drop' + (isPicked ? " sel" : "") + '" data-act="slot-role" data-slot="' + r.id + '">Выбрать роль</button>' +
        "</div>"
      );
    }).join("");

    var bank = D.roles.map(function (r) {
      var gone = placedRoles[r.id];
      var sel = picked && picked.kind === "role" && picked.id === r.id;
      return (
        '<button type="button" class="role-chip' + (sel ? " sel" : "") + (gone ? " gone" : "") +
        '" data-act="pick-role" data-id="' + r.id + '">' + esc(r.name) + "</button>"
      );
    }).join("");

    return (
      '<div class="card">' +
      '<div class="card-head"><h2>Задание 2 из 3 · Кто есть кто</h2>' +
      '<span class="hint">Выбери роль и нажми на описание</span></div>' +
      '<div class="card-body stack">' +

      '<div class="clues">' + clues + "</div>" +
      fbHtml() +
      '<div><div class="field-label">Роли</div><div class="role-bank">' + bank + "</div></div>" +
      "</div></div>"
    );
  }

  /* ---------- задание 3 ---------- */
  function task3() {
    var cs = D.caseStudy;
    var opts = cs.options.map(function (o, i) {
      return (
        '<button type="button" class="option" data-act="pick-option" data-i="' + i + '">' +
        '<span class="key">' + String.fromCharCode(65 + i) + "</span>" +
        "<span>" + esc(o.t) + "</span></button>"
      );
    }).join("");

    return (
      '<div class="card">' +
      '<div class="card-head"><h2>Задание 3 из 3 · Мини-кейс</h2>' +

      '<div class="options">' + opts + "</div>" +
      fbHtml() +
      "</div></div>"
    );
  }

  /* ---------- финал этапа ---------- */
  function doneView() {
    return (
      '<div class="card">' +
      '<div class="card-body stack" style="text-align:center;padding:38px 22px">' +
      '<div style="font-size:44px;line-height:1">🎉</div>' +
      "<h2 style=\"font-size:24px\">Этап 1 пройден</h2>" +
      '<p class="muted" style="max-width:52ch;margin:0 auto">Ты разобрался, как устроены Советы Первых: от первички до Федерального Совета, и кто есть кто в системе.</p>' +
      '<div class="row" style="justify-content:center;margin-top:22px">' +
      '<a class="btn btn-accent btn-lg" href="#/quiz">Дальше: тест на проект →</a>' +
      "</div>" +
      "</div></div>"
    );
  }

  function html() {
    var g = S.state.game;
    var body = g.done ? doneView() : g.step === 1 ? task1() : g.step === 2 ? task2() : task3();

    return (
      '<section class="stack">' +
      '<div class="hero" style="padding:26px 28px">' +
      '<span class="hero-badge">Этап 1 · игра</span>' +
      '<h1 style="font-size:clamp(24px,3.6vw,34px);max-width:none">Как устроены Советы Первых</h1>' +
      '<p class="lead">Разберись в уровнях системы и выясни, к кому идти с идеей.</p>' +
      "</div>" +
      '<div class="map-fig">' +
      '<img src="' + ASSETS.map + '" alt="Карта первичных отделений Чувашской Республики" loading="lazy">' +
      '<div class="map-body">' +
      "<h3>Найди своё первичное отделение</h3>" +
      "<p>В Чувашии 21 муниципальный округ и 505 первичных отделений — в каждом есть свой Совет Первых.</p>" +
      '<div class="facts"><div><b>21</b><span>муниципальный округ</span></div><div><b>505</b><span>первичных отделений</span></div></div>' +
      "</div></div>" +
      '<div class="row" style="gap:8px">' + stepDots(g.step) + "</div>" +
      body +
      "</section>"
    );
  }

  function complete(kind) {
    var g = S.state.game;
    if (kind === 1) {
      g.tasks[0] = true;
      g.step = 2;
      fb = { type: "ok", text: "Лестница собрана: первичка → местное → региональное → федеральный уровень." };
    } else if (kind === 2) {
      g.tasks[1] = true;
      g.step = 3;

    }
    S.save();
    window.rerender();
  }

  function mount(root) {
    root.addEventListener("click", function (e) {
      var t = e.target.closest("[data-act]");
      if (!t) return;
      var act = t.getAttribute("data-act");
      var g = S.state.game;

      if (act === "pick-level") {
        var id = t.getAttribute("data-id");
        picked = picked && picked.id === id ? null : { kind: "level", id: id };
        fb = { type: "", text: "" };
        window.rerender();
        return;
      }

      if (act === "slot-level") {
        if (!picked || picked.kind !== "level") {
          fb = { type: "info", text: "Сначала выбери карточку уровня под лестницей." };
          window.rerender();
          return;
        }
        var slotN = Number(t.getAttribute("data-n"));
        var lvl = D.levels.filter(function (l) { return l.id === picked.id; })[0];

        if (lvl.n === slotN) {
          placed[slotN] = true;
          picked = null;
          var count = Object.keys(placed).length;
          if (count === 4) { complete(1); return; }
          fb = { type: "ok", text: "Верно: " + lvl.name + " — уровень " + lvl.n + "." };

          t.classList.add("wrong");
          fb = {
            type: "bad",
            text: lvl.n > slotN
              ? "Не сюда: «" + lvl.name + "» объединяет больше отделений, это уровень выше."

          };
          picked = null;
          var node = t;
          clearTimeout(timer);
          timer = setTimeout(function () { window.rerender(); }, 700);
        }
        return;
      }

      if (act === "pick-role") {
        var rid = t.getAttribute("data-id");
        picked = picked && picked.id === rid ? null : { kind: "role", id: rid };
        fb = { type: "", text: "" };
        window.rerender();
        return;
      }

      if (act === "slot-role") {
        if (!picked || picked.kind !== "role") {
          fb = { type: "info", text: "Сначала выбери роль под карточками описаний." };
          window.rerender();
          return;
        }
        var slotRole = t.getAttribute("data-slot");
        if (picked.id === slotRole) {
          placedRoles[slotRole] = true;
          picked = null;
          var n = Object.keys(placedRoles).length;
          if (n === D.roles.length) { complete(2); return; }
          fb = { type: "ok", text: "Верно!" };
          window.rerender();

          picked = null;
          clearTimeout(timer);
          timer = setTimeout(function () { window.rerender(); }, 700);

        return;
      }

      if (act === "pick-option") {
        var i = Number(t.getAttribute("data-i"));
        var opt = D.caseStudy.options[i];
        var firstTry = !g.tasks[2];
        if (opt.ok) {
          fb = { type: "ok", text: "Верно! " + opt.why };
          complete(3);
        } else {
          fb = { type: "bad", text: "Пока нет. " + opt.why };
          t.classList.add("bad");
        }
        return;
      }
    });
  }

  window.Screens = window.Screens || {};
  window.Screens.game = function () {
    fb = { type: "", text: "" };
    return { html: html, mount: mount };
  };
})();

/* ЭТАП 2 — тест «какой проект тебе подходит» */
(function () {
  "use strict";

  var S = window.Store;
  var D = window.DATA;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function ranks() {
    var scores = {};
    Object.keys(D.directions).forEach(function (k) { scores[k] = 0; });

    D.quiz.forEach(function (q, i) {
      var ans = S.state.quiz.answers[i];
      if (ans == null) return;
      var w = q.options[ans].w;
      Object.keys(w).forEach(function (k) { scores[k] = (scores[k] || 0) + w[k]; });
    });

    return Object.keys(scores)
      .sort(function (a, b) { return scores[b] - scores[a]; })
      .map(function (k) { return { key: k, score: scores[k] }; });
  }

  function resultHtml() {
    var r = ranks();
    var top = D.directions[r[0].key];
    var alts = r.slice(1, 3).map(function (x) {
      var d = D.directions[x.key];
      return '<div class="alt-card"><b>' + esc(d.name) + "</b><span>" + esc(d.slogan) + "</span></div>";
    }).join("");

    var projects = top.projects.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("");

    return (
      '<div class="stack">' +
      '<div class="result-top" style="background:linear-gradient(135deg,' + top.color + ", #16132a)" + '">' +
      '<div class="slogan">Твоё направление · ' + esc(D.title) + "</div>" +
      "<h2>" + esc(top.name) + "</h2>" +
      '<div class="slogan" style="text-transform:none;letter-spacing:0;font-size:16px;opacity:.95">' + esc(top.slogan) + "</div>" +
      "<p style=\"margin-top:12px\">" + esc(top.text) + "</p>" +
      "</div>" +

      '<div class="card"><div class="card-body">' +
      '<div class="field-label">С чего начать</div>' +
      '<p style="font-weight:600">' + esc(top.first) + "</p>" +
      '<div class="field-label" style="margin-top:16px">Где это есть у Первых</div>' +
      '<ul class="bullets">' + projects + "</ul>" +
      "</div></div>" +

      '<div><div class="field-label">Тоже может зайти</div><div class="result-alt">' + alts + "</div></div>" +

      '<div class="row mt-8">' +
      '<a class="btn btn-accent btn-lg" href="#/collage">Дальше: фото-коллаж →</a>' +
      '<button class="btn btn-ghost" data-act="retake">Пройти тест заново</button>' +
      "</div>" +
      "</div>"
    );
  }

  function questionHtml() {
    var answers = S.state.quiz.answers;
    var i = answers.length;
    var q = D.quiz[i];
    var pct = Math.round((i / D.quiz.length) * 100);

    var opts = q.options.map(function (o, idx) {
      return (
        '<button type="button" class="option" data-act="answer" data-i="' + idx + '">' +
        '<span class="key">' + String.fromCharCode(65 + idx) + "</span>" +
        "<span>" + esc(o.t) + "</span></button>"
      );
    }).join("");

    return (
      '<div class="card"><div class="card-body stack">' +
      '<div class="quiz-progress">' +
      '<div class="row" style="justify-content:space-between"><span class="hint">Вопрос ' + (i + 1) + " из " + D.quiz.length + "</span>" +
      '<span class="hint">' + pct + "%</span></div>" +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      "</div>" +
      '<h2 class="q-title">' + esc(q.q) + "</h2>" +
      '<div class="options">' + opts + "</div>" +
      '<div class="row"><button class="btn btn-ghost btn-sm" data-act="back"' + (i === 0 ? " disabled" : "") + ">← Назад</button></div>" +
      "</div></div>"
    );
  }

  function html() {
    var z = S.state.quiz;
    var body = z.done ? resultHtml() : questionHtml();

    return (
      '<section class="stack">' +
      '<div class="hero" style="padding:26px 28px">' +
      '<span class="hero-badge">Этап 2 · тест</span>' +
      '<h1 style="font-size:clamp(24px,3.6vw,34px);max-width:none">Твой проект у Первых</h1>' +
      '<p class="lead">Семь коротких вопросов — и программа подскажет направление, где тебе будет интереснее всего.</p>' +
      "</div>" +
      body +
      "</section>"
    );
  }

  function mount(root) {
    root.addEventListener("click", function (e) {
      var t = e.target.closest("[data-act]");
      if (!t) return;
      var act = t.getAttribute("data-act");
      var z = S.state.quiz;

      if (act === "answer") {
        var idx = Number(t.getAttribute("data-i"));
        z.answers.push(idx);
        if (z.answers.length >= D.quiz.length) {
          z.done = true;
          z.result = ranks().slice(0, 3).map(function (x) { return x.key; });
          S.save();
          window.toast("Результат готов!");
        } else {
          S.save();
        }
        window.rerender();
        return;
      }

      if (act === "back") {
        if (z.answers.length) {
          z.answers.pop();
          z.done = false;
          z.result = null;
          S.save();
          window.rerender();
        }
        return;
      }

      if (act === "retake") {
        z.answers = [];
        z.done = false;
        z.result = null;
        S.save();
        window.rerender();
        return;
      }
    });
  }

  window.Screens = window.Screens || {};
  window.Screens.quiz = function () {
    return { html: html, mount: mount };
  };
})();
