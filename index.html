    blue:  { bg: "#1b3f8f", panel: "#2b5ab8", text: "#ffffff", sub: "#d3def3", accent: "#f2b742", chipBg: "#ffffff", chipText: "#14306e" },
    night: { bg: "#12203f", panel: "#1b2f5c", text: "#ffffff", sub: "#b9c6e4", accent: "#e4232f", chipBg: "#ffffff", chipText: "#12203f" }
  };

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function totalPhotos() {
    var n = 0;
    photos.forEach(function (arr) { n += arr.length; });
    return n;
  }

  function filledStations() {
    var n = 0;
    photos.forEach(function (arr) { if (arr.length) n++; });
    return n;
  }

  function persist() {
    var map = new Map();
    photos.forEach(function (arr, k) {
      if (arr.length) map.set(k, arr.map(function (p) { return p.blob; }));
    });
    window.PhotoDB.put(map);
  }

  function ensureLoaded() {
    if (loaded || loading) return;
    loading = true;
    window.PhotoDB.load().then(function (rows) {
      rows.forEach(function (row) {
        var arr = (row.value || []).map(function (blob) {
          return { blob: blob, url: URL.createObjectURL(blob) };
        });
        if (arr.length) photos.set(row.key, arr);
      });
      loaded = true;
      loading = false;
      window.rerender();
    }).catch(function () {
      loaded = true;
      loading = false;
    });
  }

  /* ---------- canvas ---------- */
  function rr(ctx, x, y, w, h, r) {
    var rad = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    if (ctx.roundRect) {
      ctx.roundRect(x, y, w, h, rad);
      return;
    }
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function toBitmap(blob) {
    if (window.createImageBitmap) {
      return createImageBitmap(blob, { imageOrientation: "from-image" })
        .catch(function () { return createImageBitmap(blob); })
        .catch(function () { return fromImg(blob); });
    }
    return fromImg(blob);
  }

  function fromImg(blob) {
    return new Promise(function (resolve, reject) {
      var img = new Image();
      var url = URL.createObjectURL(blob);
      img.onload = function () {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("decode"));
      };
      img.src = url;
    });
  }

  function drawCover(ctx, img, x, y, w, h) {
    var iw = img.width || img.naturalWidth;
    var ih = img.height || img.naturalHeight;
    if (!iw || !ih) return;
    var scale = Math.max(w / iw, h / ih);
    var dw = iw * scale;
    var dh = ih * scale;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }

  function drawPhotosInTile(ctx, bitmaps, x, y, w, h) {
    var gap = 8;

    function clipDraw(bm, bx, by, bw, bh) {
      ctx.save();
      rr(ctx, bx, by, bw, bh, 8);
      ctx.clip();
      drawCover(ctx, bm, bx, by, bw, bh);
      ctx.restore();
    }

    var n = bitmaps.length;
    if (n === 1) {
      clipDraw(bitmaps[0], x, y, w, h);
    } else if (n === 2) {
      clipDraw(bitmaps[0], x, y, (w - gap) / 2, h);
      clipDraw(bitmaps[1], x + (w + gap) / 2, y, (w - gap) / 2, h);
    } else if (n === 3) {
      clipDraw(bitmaps[0], x, y, (w - gap) / 2, h);
      clipDraw(bitmaps[1], x + (w + gap) / 2, y, (w - gap) / 2, (h - gap) / 2);
      clipDraw(bitmaps[2], x + (w + gap) / 2, y + (h + gap) / 2, (w - gap) / 2, (h - gap) / 2);
    } else {
      var cw = (w - gap) / 2;
      var ch = (h - gap) / 2;
      clipDraw(bitmaps[0], x, y, cw, ch);
      clipDraw(bitmaps[1], x + cw + gap, y, cw, ch);
      clipDraw(bitmaps[2], x, y + ch + gap, cw, ch);
      clipDraw(bitmaps[3], x + cw + gap, y + ch + gap, cw, ch);
    }
  }

  function tileLabel(ctx, pal, text, x, y, maxW) {
    ctx.font = '700 19px "Segoe UI", system-ui, sans-serif';
    var w = Math.min(ctx.measureText(text).width + 24, maxW);
    var h = 38;
    ctx.save();
    ctx.fillStyle = pal.chipBg;
    rr(ctx, x, y, w, h, 19);
    ctx.fill();
    ctx.fillStyle = pal.chipText;
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(text, x + 12, y + h / 2 + 1, maxW - 24);
    ctx.restore();
  }

  async function buildCollage() {
    var fmt = S.state.collage.format;
    var style = S.state.collage.style;
    var pal = PALETTES[style] || PALETTES.paper;

    var W = 1080;
    var H = fmt === "1" ? 1080 : 1350;
    var M = 54;

    var canvas = document.createElement("canvas");
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");

    ctx.fillStyle = pal.bg;
    ctx.fillRect(0, 0, W, H);

    /* декор */
    ctx.save();
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = pal.accent;
    ctx.beginPath();
    ctx.arc(W - 20, 10, 200, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    /* шапка */
    var headH = 150;

    ctx.fillStyle = pal.accent;
    rr(ctx, M, M, 56, 56, 14);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = '800 32px "Segoe UI", system-ui, sans-serif';
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("П", M + 28, M + 30);

    ctx.textAlign = "left";
    ctx.fillStyle = pal.text;
    ctx.font = '800 44px "Segoe UI", system-ui, sans-serif';
    ctx.fillText("КВЕСТ ПЕРВЫХ", M + 76, M + 20);

    ctx.fillStyle = pal.sub;
    ctx.font = '400 21px "Segoe UI", system-ui, sans-serif';
    ctx.fillText("Совет Первых Чувашской Республики", M + 76, M + 52);

    /* площадки с фото */
    var tiles = D.stations.filter(function (st) {
      return (photos.get(st.id) || []).length > 0;
    });

    var n = tiles.length;
    var gap = 18;
    var gridTop = headH;
    var gridBottom = H - 96;
    var areaH = gridBottom - gridTop;
    var fullW = W - M * 2;

    /* подбираем число колонок под пропорцию плитки ~4:3 */
    var cols = 1;
    var bestDiff = Infinity;
    for (var cc = 1; cc <= 3; cc++) {
      var rr2 = Math.ceil(n / cc);
      var tw2 = (fullW - gap * (cc - 1)) / cc;
      var th2 = (areaH - gap * (rr2 - 1)) / rr2;
      var diff = Math.abs(tw2 / th2 - 1.3);
      if (diff < bestDiff - 0.001) {
        bestDiff = diff;
        cols = cc;
      }
    }

    var rows = Math.ceil(n / cols);

    for (var r = 0; r < rows; r++) {
      var count = Math.min(cols, n - r * cols);
      var rowH = (areaH - gap * (rows - 1)) / rows;
      var tileW = (fullW - gap * (count - 1)) / count;
      var y = gridTop + r * (rowH + gap);

      for (var c = 0; c < count; c++) {
        var st = tiles[r * cols + c];
        var x = M + c * (tileW + gap);

        var list = photos.get(st.id) || [];
        var bitmaps = [];
        for (var j = 0; j < list.length; j++) {
          try {
            bitmaps.push(await toBitmap(list[j].blob));
          } catch (e) { /* битое фото пропускаем */ }
        }

        ctx.save();
        rr(ctx, x, y, tileW, rowH, 14);
        ctx.clip();

        ctx.fillStyle = pal.panel;
        ctx.fillRect(x, y, tileW, rowH);

        if (bitmaps.length) {
          drawPhotosInTile(ctx, bitmaps.slice(0, 4), x, y, tileW, rowH);

          var grad = ctx.createLinearGradient(0, y + rowH - 96, 0, y + rowH);
          grad.addColorStop(0, "rgba(0,0,0,0)");
          grad.addColorStop(1, "rgba(0,0,0,.6)");
          ctx.fillStyle = grad;
          ctx.fillRect(x, y + rowH - 96, tileW, 96);
        }
        ctx.restore();

        ctx.font = '700 19px "Segoe UI", system-ui, sans-serif';
        tileLabel(ctx, pal, st.short || st.name, x + 10, y + rowH - 48, tileW - 20);
      }
    }

    /* подвал */
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillStyle = pal.text;
    ctx.font = '700 22px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(D.hashtag, M, H - 50);

    ctx.textAlign = "right";
    ctx.fillStyle = pal.sub;
    ctx.font = '400 20px "Segoe UI", system-ui, sans-serif';
    ctx.fillText(new Date().toLocaleDateString("ru-RU"), W - M, H - 50);

    return await new Promise(function (resolve, reject) {
      canvas.toBlob(function (blob) {
        if (blob) resolve(blob);
        else reject(new Error("toBlob"));
      }, "image/png");
    });
  }

  /* ---------- разметка ---------- */
  function stationCard(st) {
    var list = photos.get(st.id) || [];
    var thumbs = list.map(function (p, i) {
      return (
        '<div class="thumb"><img src="' + p.url + '" alt="Фото: ' + esc(st.name) + '">' +
        '<button type="button" data-act="del" data-station="' + st.id + '" data-i="' + i + '" aria-label="Удалить фото">×</button></div>'
      );
    }).join("");

    var full = list.length >= MAX_PER_STATION;

    return (
      '<div class="station-card">' +
      "<div><h3>" + esc(st.name) + "</h3>" +
      '<p class="station-hint">' + esc(st.hint) + "</p></div>" +
      (thumbs ? '<div class="thumbs">' + thumbs + "</div>" : "") +
      (full
        ? '<p class="hint">Максимум ' + MAX_PER_STATION + " фото</p>"
        : '<label class="dropzone"><input type="file" accept="image/*" multiple data-station="' + st.id + '" aria-label="Добавить фото: ' + esc(st.name) + '">' +
          "<b>Добавить фото</b><span>до " + MAX_PER_STATION + " шт.</span></label>") +
      "</div>"
    );
  }

  function previewHtml() {
    if (busy) {
      return '<div class="preview-img"><div class="preview-empty">Собираем коллаж…</div></div>';
    }
    if (previewUrl) {
      return (
        '<div class="preview-img"><img src="' + previewUrl + '" alt="Готовый коллаж"></div>' +
        '<div class="preview-actions">' +
        '<a class="btn btn-primary btn-block" href="' + previewUrl + '" download="kvest-pervyh-kollazh.png">Скачать PNG</a>' +
        '<button class="btn btn-ghost btn-block" data-act="caption">Скопировать текст поста</button>' +
        '<button class="btn btn-ghost btn-block" data-act="vk">Отправить в ВК</button>' +
        '<a class="btn btn-accent btn-block" href="#/finish">Дальше: финал →</a>' +
        "</div>"
      );
    }
    return (
      '<div class="preview-img"><div class="preview-empty">' +
      "<strong>Здесь появится коллаж</strong><br>Добавь фото хотя бы с двух площадок и нажми «Собрать коллаж»." +
      "</div></div>"
    );
  }

  function html() {
    var z = S.state.collage;
    var total = totalPhotos();
    var stationsOk = filledStations();

    var stations = D.stations.map(stationCard).join("");

    function fmtBtn(key, label) {
      return '<button type="button" class="style-chip' + (z.format === key ? " sel" : "") + '" data-act="format" data-v="' + key + '">' + label + "</button>";
    }

    function styleBtn(key, label, color) {
      return '<button type="button" class="style-chip' + (z.style === key ? " sel" : "") + '" data-act="style" data-v="' + key + '">' +
        '<span class="swatch" style="background:' + color + '"></span>' + label + "</button>";
    }

    return (
      '<section class="stack">' +
      '<div class="hero" style="padding:26px 28px">' +
      '<span class="hero-badge">Этап 3 · фото</span>' +
      '<h1 style="font-size:clamp(22px,3.2vw,32px);max-width:none">Коллаж с площадок Премии</h1>' +
      '<p class="lead">Собери кадры с площадок — «Родные-Любимые», «Зарница 2.0», «Большая перемена», конкурс первичных отделений, «Гранты Первых», квест по ценностям, «Клубок счастья» и фотозоны. Получится картинка для поста в сообществе.</p>' +
      "</div>" +

      '<div class="collage-layout">' +
      '<div class="stack">' +
      '<div class="stations-grid">' + stations + "</div>" +

      '<div class="card"><div class="card-body stack">' +
      '<div class="row" style="justify-content:space-between">' +
      '<span class="hint">Фото: ' + total + " · площадок: " + stationsOk + " из " + D.stations.length + "</span>" +
      '<button class="btn btn-ghost btn-sm" data-act="clear">Очистить всё</button>' +
      "</div>" +

      '<div><div class="field-label">Формат</div><div class="style-row">' +
      fmtBtn("45", "4:5 · для поста") + fmtBtn("1", "1:1 · квадрат") +
      "</div></div>" +

      '<div><div class="field-label">Стиль</div><div class="style-row">' +
      styleBtn("paper", "Белый", "#ffffff") +
      styleBtn("blue", "Синий", "#1b3f8f") +
      styleBtn("night", "Тёмный", "#12203f") +
      "</div></div>" +

      '<button class="btn btn-accent btn-block btn-lg" data-act="build"' + (busy ? " disabled" : "") + '>Собрать коллаж</button>' +
      '<p class="hint">Фото остаются в твоём браузере — никуда не загружаются.</p>' +
      "</div></div>" +
      "</div>" +

      '<div class="preview">' + previewHtml() + "</div>" +
      "</div>" +
      "</section>"
    );
  }

  /* ---------- события ---------- */
  function mount(root) {
    ensureLoaded();

    root.addEventListener("change", function (e) {
      var input = e.target;
      if (!input || input.type !== "file") return;
      var station = input.getAttribute("data-station");
      if (!station) return;

      var files = Array.prototype.slice.call(input.files || []).filter(function (f) {
        return /^image\//.test(f.type);
      });
      if (!files.length) return;

      var arr = photos.get(station) || [];
      var free = MAX_PER_STATION - arr.length;
      if (free <= 0) {
        window.toast("Для этой площадки уже максимум фото");
        return;
      }

      files.slice(0, free).forEach(function (file) {
        arr.push({ blob: file, url: URL.createObjectURL(file) });
      });
      photos.set(station, arr);
      persist();

      if (files.length > free) window.toast("Добавили " + free + " фото — больше не помещается");
      else window.toast("Фото добавлено");

      window.rerender();
    });

    root.addEventListener("click", function (e) {
      var t = e.target.closest("[data-act]");
      if (!t) return;
      var act = t.getAttribute("data-act");
      var z = S.state.collage;

      if (act === "del") {
        var station = t.getAttribute("data-station");
        var idx = Number(t.getAttribute("data-i"));
        var arr = photos.get(station) || [];
        if (arr[idx]) {
          URL.revokeObjectURL(arr[idx].url);
          arr.splice(idx, 1);
          if (!arr.length) photos.delete(station);
          else photos.set(station, arr);
          persist();
          clearPreview();
          window.rerender();
        }
        return;
      }

      if (act === "clear") {
        photos.forEach(function (arr) {
          arr.forEach(function (p) { URL.revokeObjectURL(p.url); });
        });
        photos.clear();
        window.PhotoDB.clear();
        clearPreview();
        window.rerender();
        window.toast("Фото очищены");
        return;
      }

      if (act === "format") {
        z.format = t.getAttribute("data-v");
        S.save();
        clearPreview();
        window.rerender();
        return;
      }

      if (act === "style") {
        z.style = t.getAttribute("data-v");
        S.save();
        clearPreview();
        window.rerender();
        return;
      }

      if (act === "build") {
        if (totalPhotos() < 2 || filledStations() < 2) {
          window.toast("Добавь хотя бы по одному фото с двух разных площадок");
          return;
        }
        busy = true;
        window.rerender();

        buildCollage().then(function (blob) {
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewBlob = blob;
          previewUrl = URL.createObjectURL(blob);
          busy = false;
          if (!z.done) {
            z.done = true;
            S.save();
          }
          window.rerender();
          setTimeout(function () {
            var p = document.querySelector(".preview");
            if (p) p.scrollIntoView({ block: "center", behavior: "smooth" });
          }, 60);
          window.toast("Коллаж готов — скачай и прикрепи в сообщество");
        }).catch(function () {
          busy = false;
          window.rerender();
          window.toast("Не получилось собрать коллаж, попробуй ещё раз");
        });
        return;
      }

      if (act === "caption") {
        var text = D.caption + "\n" + D.hashtag;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function () {
            window.toast("Текст поста скопирован");
          }).catch(function () {
            window.toast("Не удалось скопировать — выдели текст вручную");
          });
        } else {
          window.toast("Копирование не поддерживается в этом браузере");
        }
        return;
      }

      if (act === "vk") {
        if (D.vk) window.open(D.vk, "_blank", "noopener");
        else window.toast("Скачай картинку и прикрепи её к посту в сообществе — ссылку добавит наставник");
        return;
      }
    });
  }

  function clearPreview() {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      previewBlob = null;
    }
  }

  window.Screens = window.Screens || {};
  window.Screens.collage = function () {
    return { html: html, mount: mount };
  };
})();

</script>
  <script>
/* Каркас: роутер, шаги, выбор отделения, старт, финал и статистика */
(function () {
  "use strict";

  var S = window.Store;
  var D = window.DATA;
  var Screens = window.Screens;

  var app = document.getElementById("app");
  var stepsEl = document.getElementById("steps");
  var toastEl = document.getElementById("toast");
  var toastTimer = null;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  window.toast = function (text) {
    if (!toastEl) return;
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 3200);
  };

  /* ---------- шапка: этапы ---------- */
  function renderSteps(path) {
    if (!stepsEl) return;
    var defs = [
      { key: "game", n: 1, label: "Игра", href: "#/game" },
      { key: "quiz", n: 2, label: "Тест", href: "#/quiz" },
      { key: "collage", n: 3, label: "Коллаж", href: "#/collage" }
    ];

    var current = path.indexOf("game") > -1 ? 1 : path.indexOf("quiz") > -1 ? 2 : path.indexOf("collage") > -1 ? 3 : 0;

    stepsEl.innerHTML = defs.map(function (d) {
      var done = S.state[d.key] && S.state[d.key].done;
      var unlocked = S.isUnlocked(d.n);
      var cls = "step";
      if (done) cls += " done";
      if (current === d.n) cls += " active";
      if (!unlocked) cls += " locked";

      return (
        '<button type="button" class="' + cls + '" data-href="' + d.href + '" data-stage="' + d.n + '">' +
        '<span class="num">' + (done ? "✓" : d.n) + "</span>" +
        "<span>" + d.label + "</span></button>"
      );
    }).join("");
  }

  stepsEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-stage]");
    if (!b) return;
    var n = Number(b.getAttribute("data-stage"));
    if (!S.isUnlocked(n)) {
      window.toast("Сначала пройди предыдущий этап");
      return;
    }
    location.hash = b.getAttribute("data-href");
  });

  /* ---------- выбор отделения ---------- */
  function placeValues() {
    var sel = document.getElementById("districtSel");
    var inp = document.getElementById("schoolInp");
    return {
      district: sel ? sel.value : "",
      school: inp ? inp.value.trim() : ""
    };
  }

  function mapQuery(p) {
    var q = "Движение Первых " + (p.district || "Чувашия");
    if (p.school) q += " " + p.school;
    return q;
  }

  function openMap(kind) {
    var p = placeValues();
    if (!p.district) {
      window.toast("Сначала выбери муниципальный округ");
      return;
    }
    S.setPlace(p.district, p.school);
    refreshPlaceHint();
    var q = encodeURIComponent(mapQuery(p));
    var url = kind === "2gis" ? "https://2gis.ru/search/" + q : "https://yandex.ru/maps/?text=" + q;
    window.open(url, "_blank", "noopener");
    window.toast("Открыли " + (kind === "2gis" ? "2ГИС" : "Яндекс Карты") + " — найди свою школу");
  }

  function refreshPlaceHint() {
    var hint = document.getElementById("placeHint");
    if (!hint) return;
    var p = S.state.profile || {};
    hint.textContent = p.district
      ? "Сохранено: " + p.district + (p.school ? ", " + p.school : "")
      : "Выбери округ и школу — запомним для финала и статистики";
  }

  function savePlace() {
    var p = placeValues();
    if (!p.district) {
      window.toast("Выбери муниципальный округ");
      return;
    }
    S.setPlace(p.district, p.school);
    refreshPlaceHint();
    window.toast("Отделение сохранено");
  }

  function placeCard() {
    var p = S.state.profile || {};
    var opts = ['<option value="">— выбери округ —</option>'].concat(
      D.districts.map(function (d) {
        return '<option value="' + esc(d) + '"' + (p.district === d ? " selected" : "") + ">" + esc(d) + "</option>";
      })
    ).join("");

    return (
      '<div class="card"><div class="card-body place-grid">' +
      '<div class="stack place-form">' +
      '<div><h2 style="font-size:18px">Найди своё первичное отделение</h2>' +
      '<p class="muted mt-8">Выбери свой город или муниципальный округ и открой поиск по 2ГИС или Яндекс Картам — там видны школы и организации. Сохраним выбор для финала и общей статистики.</p></div>' +
      '<div class="field"><label class="field-label" for="districtSel">Муниципальный округ</label>' +
      '<select id="districtSel">' + opts + "</select></div>" +
      '<div class="field"><label class="field-label" for="schoolInp">Школа или первичное отделение</label>' +
      '<input id="schoolInp" maxlength="90" placeholder="Например: СОШ № 12" value="' + esc(p.school || "") + '">' +
      '<small>Только название — без фамилий и личных данных</small></div>' +
      '<div class="row">' +
      '<button class="btn btn-primary btn-sm" type="button" data-act="map" data-map="2gis">Открыть в 2ГИС</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-act="map" data-map="yandex">Открыть в Яндекс Картах</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" data-act="save-place">Сохранить</button>' +
      "</div>" +
      '<p class="hint" id="placeHint"></p>' +
      "</div>" +
      '<div class="place-art"><img src="' + ASSETS.scene + '" alt="Мать-Покровительница и собор — символы Чувашии" loading="lazy"></div>' +
      "</div></div>"
    );
  }

  /* ---------- старт ---------- */
  function mapFigure() {
    return (
      '<div class="map-fig">' +
      '<img src="' + ASSETS.map + '" alt="Карта первичных отделений Чувашской Республики" loading="lazy">' +
      '<div class="map-body">' +
      "<h3>Найди своё первичное отделение</h3>" +
      "<p>В Чувашии 21 муниципальный округ и 505 первичных отделений. У каждого — свой Совет Первых, а дальше уровни поднимаются до Федерального Совета.</p>" +
      '<div class="facts"><div><b>21</b><span>муниципальный округ</span></div><div><b>505</b><span>первичных отделений</span></div></div>' +
      "</div></div>"
    );
  }

  function startScreen() {
    var g = S.state.game.done, z = S.state.quiz.done, c = S.state.collage.done;
    var started = g || z || c;

    var stageDefs = [
      { n: 1, href: "#/game", title: "Игра: как устроены Советы", desc: "Лестница уровней от первички до Федерального Совета и роли: кто ребёнок, кто наставник, к кому идти с идеей.", done: g },
      { n: 2, href: "#/quiz", title: "Тест: твоё направление", desc: "Семь вопросов про интересы — программа подскажет, в каком проекте Первых тебе будет интереснее всего.", done: z },
      { n: 3, href: "#/collage", title: "Коллаж с площадок", desc: "Фото со станций Премии — от «Родных-Любимых» до фотозон — в одну картинку для поста в сообществе.", done: c }
    ];

    var cards = stageDefs.map(function (s) {
      var state;
      if (s.done) state = '<span class="state ok">Пройдено</span>';
      else if (S.isUnlocked(s.n)) state = '<span class="state now">Твой шаг</span>';
      else state = '<span class="state wait">Откроется позже</span>';

      var btn = S.isUnlocked(s.n)
        ? '<a class="btn ' + (s.done ? "btn-ghost" : "btn-primary") + ' btn-sm" href="' + s.href + '">' + (s.done ? "Повторить" : "Начать") + "</a>"
        : '<button class="btn btn-ghost btn-sm" disabled>Закрыто</button>';

      return (
        '<article class="stage-card">' +
        '<div class="num">' + s.n + "</div>" +
        "<h3>" + esc(s.title) + "</h3>" +
        "<p>" + esc(s.desc) + "</p>" +
        '<div class="foot-row">' + state + btn + "</div>" +
        "</article>"
      );
    }).join("");

    var platforms = D.platforms.map(function (p, i) {
      return (
        '<div class="platform">' +
        '<span class="ico">' + (i + 1) + "</span>" +
        "<div><b>" + esc(p.name) + "</b><span>" + esc(p.desc) + "</span></div>" +
        "</div>"
      );
    }).join("");

    return {
      html:
        '<section class="stack">' +
        '<div class="hero">' +
        '<span class="hero-badge">Совет Первых Чувашской Республики · III созыв</span>' +
        "<h1>Квест Первых</h1>" +
        '<p class="lead">Три этапа: разберись, как устроены Советы Первых, узнай своё направление и собери коллаж с площадок Премии. В финале — зачётный код и открытка от наставников.</p>' +
        '<div class="hero-actions">' +
        '<a class="btn btn-primary btn-lg" href="' + (started ? "#/finish" : "#/game") + '">' + (started ? "Продолжить квест" : "Начать квест") + "</a>" +
        '<a class="btn btn-ghost btn-lg" href="#/stats">Статистика участников</a>' +
        "</div>" +
        '<div class="hero-meta">' +
        "<div><b>3</b>этапа</div>" +
        "<div><b>9</b>площадок</div>" +
        "<div><b>10–15</b>минут</div>" +
        "</div>" +
        '<div class="hero-motto">' + esc(D.motto) + "</div>" +
        "</div>" +

        mapFigure() +
        placeCard() +

        '<div class="section-title"><h2>Этапы квеста</h2><span>проходи по порядку</span></div>' +
        '<div class="grid-3">' + cards + "</div>" +

        '<div class="section-title"><h2>Площадки Премии</h2><span>9 станций — фото с каждой идут в коллаж</span></div>' +
        '<div class="platforms">' + platforms + "</div>" +

        '<div class="card"><div class="card-body stack">' +
        '<h2 style="font-size:18px">Как получить открытку</h2>' +
        '<div class="checklist" style="margin:0;max-width:none">' +
        '<div class="check"><span class="tick">1</span><span>Пройди все три этапа на сайте — игра, тест и коллаж.</span></div>' +
        '<div class="check"><span class="tick">2</span><span>Покажи финальный экран с зачётным кодом наставнику на площадке.</span></div>' +
        '<div class="check"><span class="tick">3</span><span>Забери открытку. А коллаж прикрепи к посту в сообществе Совета Первых — разыграем блокнот от регионального отделения с автографами, наклейками и вдохновляющими фразами.</span></div>' +
        "</div>" +
        '<div class="row" style="margin-top:16px">' +
        vkLink("btn btn-ghost btn-sm", "Сообщество Совета Первых во ВКонтакте →") +
        "</div>" +
        "</div></div>" +
        "</section>",
      mount: function (root) {
        refreshPlaceHint();
        root.addEventListener("click", function (e) {
          var t = e.target.closest("[data-act]");
          if (!t) return;
          var act = t.getAttribute("data-act");
          if (act === "map") openMap(t.getAttribute("data-map"));
          if (act === "save-place") savePlace();
        });
      }
    };
  }

  function vkLink(cls, label) {
    if (!D.vk) return "";
    return '<a class="' + cls + '" href="' + esc(D.vk) + '" target="_blank" rel="noopener">' + esc(label) + "</a>";
  }

  /* ---------- финал ---------- */
  function confetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var colors = ["#e4232f", "#1b3f8f", "#2b5ab8", "#f2b742", "#ffffff"];
    for (var i = 0; i < 34; i++) {
      var el = document.createElement("span");
      el.className = "confetti-piece";
      el.style.left = Math.random() * 100 + "vw";
      el.style.background = colors[i % colors.length];
      el.style.animationDuration = 2.6 + Math.random() * 2.2 + "s";
      el.style.animationDelay = Math.random() * 0.8 + "s";
      el.style.width = 6 + Math.random() * 7 + "px";
      el.style.height = 8 + Math.random() * 10 + "px";
      document.body.appendChild(el);
      (function (node) {
        setTimeout(function () { node.remove(); }, 6200);
      })(el);
    }
  }

  function submitResult(btn) {
    var p = S.state.profile || {};
    if (!p.district) {
      window.toast("Сначала выбери своё отделение на главной странице");
      return;
    }
    if (!window.API || !window.API.enabled) {
      window.toast("Сбор ещё не подключён — покажу демо-статистику");
      location.hash = "#/stats";
      return;
    }
    if (S.state.submitted) {
      window.toast("Ты уже в статистике");
      return;
    }
    var rec = {
      district: p.district,
      school: (p.school || "не указано").slice(0, 90),
      direction: (S.state.quiz.result && S.state.quiz.result[0]) || null,
      code: S.ensureCode()
    };
    btn.disabled = true;
    btn.textContent = "Отправляем…";
    window.API.submit(rec).then(function () {
      S.state.submitted = true;
      S.save();
      window.toast("Готово! Твой результат в общей статистике");
      btn.textContent = "Отправлено ✓";
      btn.disabled = true;
    }).catch(function (err) {
      btn.disabled = false;
      btn.textContent = "Отправить в статистику";
      window.toast("Не получилось отправить: " + err.message);
    });
  }

  function finishScreen() {
    var all = S.allDone();
    var p = S.state.profile || {};

    if (!all) {
      var missing = [
        { done: S.state.game.done, n: 1, href: "#/game", label: "Игра: устройство Советов Первых" },
        { done: S.state.quiz.done, n: 2, href: "#/quiz", label: "Тест: твоё направление" },
        { done: S.state.collage.done, n: 3, href: "#/collage", label: "Коллаж с площадок" }
      ].filter(function (x) { return !x.done; });

      return {
        html:
          '<section class="stack">' +
          '<div class="hero" style="padding:26px 28px">' +
          '<span class="hero-badge">Финал</span>' +
          '<h1 style="font-size:clamp(22px,3.2vw,32px)">Ещё чуть-чуть</h1>' +
          '<p class="lead">Открытка ждёт, когда пройдены все три этапа. Осталось:</p>' +
          "</div>" +
          '<div class="stack">' +
          missing.map(function (m) {
            return (
              '<div class="card"><div class="card-body row">' +
              '<span class="pill">этап ' + m.n + "</span>" +
              '<span class="grow" style="font-weight:600">' + esc(m.label) + "</span>" +
              '<a class="btn btn-primary btn-sm" href="' + m.href + '">Продолжить</a>' +
              "</div></div>"
            );
          }).join("") +
          "</div></section>"
      };
    }

    var code = S.ensureCode();

    return {
      html:
        '<section class="stack">' +
        '<div class="card"><div class="finish-hero">' +
        '<div class="ornament" style="max-width:220px;margin:0 auto 10px"></div>' +
        "<h1>Квест пройден!</h1>" +
        '<p>Ты разобрался в устройстве Советов Первых, нашёл своё направление и собрал коллаж с площадок Премии. Теперь — к наставнику за открыткой.</p>' +
        '<div class="reward">' +
        '<span class="pill">Зачётный код участника</span>' +
        '<div class="code">' + esc(code) + "</div>" +
        '<p class="hint">Покажи этот экран наставнику — он выдаст открытку.</p>' +
        "</div>" +
        (p.district
          ? '<p class="hint mt-16">Твоё отделение: <b>' + esc(p.district) + (p.school ? ", " + esc(p.school) : "") + "</b></p>"
          : '<p class="hint mt-16">Отделение не выбрано — <a href="#/">выбери на главной</a>, чтобы попасть в статистику.</p>') +
        '<div class="checklist">' +
        '<div class="check"><span class="tick">✓</span><span>Этап 1: устройство Советов Первых</span></div>' +
        '<div class="check"><span class="tick">✓</span><span>Этап 2: тест на направление</span></div>' +
        '<div class="check"><span class="tick">✓</span><span>Этап 3: коллаж с площадок</span></div>' +
        "</div>" +
        '<div class="row" style="justify-content:center;margin-top:22px">' +
        '<button class="btn btn-primary" type="button" data-act="submit"' + (S.state.submitted ? " disabled" : "") + ">" +
        (S.state.submitted ? "Отправлено ✓" : "Отправить в статистику") + "</button>" +
        '<a class="btn btn-ghost" href="#/stats">Статистика участников</a>' +
        "</div>" +
        '<div class="row" style="justify-content:center;margin-top:12px">' +
        '<a class="btn btn-ghost btn-sm" href="#/collage">Открыть коллаж</a>' +
        '<a class="btn btn-ghost btn-sm" href="#/quiz">Результат теста</a>' +
        vkLink("btn btn-ghost btn-sm", "Сообщество ВК") +
        "</div>" +
        '<p class="hint mt-16">Коллаж прикрепи к посту в сообществе Совета Первых — участвуй в розыгрыше блокнота от регионального отделения с автографами, наклейками и вдохновляющими фразами.</p>' +
        "</div></div>" +
        "</section>",
      mount: function (root) {
        confetti();
        root.addEventListener("click", function (e) {
          var t = e.target.closest("[data-act]");
          if (t && t.getAttribute("data-act") === "submit") submitResult(t);
        });
      }
    };
  }

  /* ---------- статистика ---------- */
  function aggregate(rows) {
    var byDistrict = {};
    var bySchool = {};

    rows.forEach(function (r) {
      var d = r.district || "не указано";
      var s = r.school || "не указано";
      byDistrict[d] = (byDistrict[d] || 0) + 1;
      var key = s + "||" + d;
      bySchool[key] = (bySchool[key] || 0) + 1;
    });

    function toArr(obj) {
      return Object.keys(obj).map(function (k) {
        return { name: k, count: obj[k] };
      }).sort(function (a, b) { return b.count - a.count; });
    }

    return {
      total: rows.length,
      districts: toArr(byDistrict),
      schools: toArr(bySchool)
    };
  }

  function barsHtml(items, limit) {
    if (!items.length) return '<p class="muted">Пока пусто.</p>';
    var max = items[0].count;
    var list = items.slice(0, limit || items.length);
    return list.map(function (it) {
      var pct = Math.max(4, Math.round((it.count / max) * 100));
      return (
        '<div class="stat-row">' +
        '<span class="stat-name">' + esc(it.name) + "</span>" +
        '<span class="stat-bar"><i style="width:' + pct + '%"></i></span>' +
        '<b class="stat-count">' + it.count + "</b>" +
        "</div>"
      );
    }).join("");
  }

  function renderStats(rows) {
    var body = document.getElementById("statsBody");
    if (!body) return;

    var a = aggregate(rows);
    if (!a.total) {
      body.innerHTML =
        '<div class="notice">Пока никто не отправил результат. Пройди квест и нажми «Отправить в статистику» на финальном экране.</div>';
      return;
    }

    var schools = a.schools.slice(0, 15).map(function (s) {
      var parts = s.name.split("||");
      return (
        "<tr><td>" + esc(parts[0]) + "</td><td>" + esc(parts[1] || "") + "</td><td class=\"num\">" + s.count + "</td></tr>"
      );
    }).join("");

    body.innerHTML =
      '<div class="kpi-row">' +
      "<div class=\"kpi\"><b>" + a.total + "</b><span>участников</span></div>" +
      "<div class=\"kpi\"><b>" + a.districts.length + "</b><span>округов</span></div>" +
      "<div class=\"kpi\"><b>" + a.schools.length + "</b><span>первичек</span></div>" +
      "</div>" +
      '<div class="stat-block"><h3>По муниципальным округам</h3>' + barsHtml(a.districts) + "</div>" +
      '<div class="stat-block"><h3>Топ первичных отделений</h3>' +
      '<div class="table-wrap"><table><thead><tr><th>Школа / отделение</th><th>Округ</th><th class="num">Участников</th></tr></thead><tbody>' +
      schools +
      "</tbody></table></div></div>" +
      '<p class="hint">Обновлено ' + new Date().toLocaleString("ru-RU") + ". Личные данные не собираются — только школа и округ.</p>";
  }

  function loadStats() {
    var body = document.getElementById("statsBody");
    if (!body) return;
    body.innerHTML = '<p class="muted">Загружаем данные…</p>';
    window.API.rows().then(function (rows) {
      if (!document.getElementById("statsBody")) return;
      renderStats(rows);
    }).catch(function (err) {
      var b = document.getElementById("statsBody");
      if (b) b.innerHTML = '<div class="notice bad">Не удалось загрузить статистику: ' + esc(err.message) + "</div>";
    });
  }

  function statsScreen() {
    var demo = !window.API.enabled;
    return {
      html:
        '<section class="stack">' +
        '<div class="hero" style="padding:26px 28px">' +
        '<span class="hero-badge">Статистика</span>' +
        '<h1 style="font-size:clamp(22px,3.2vw,32px)">Кто проходит квест</h1>' +
        '<p class="lead">Распределение участников по муниципальным округам и первичным отделениям.</p>' +
        "</div>" +
        (demo
          ? '<div class="notice">Демо-режим: показаны примерные данные. Чтобы видеть реальные ответы, подключите сбор — инструкция в <b>STATS.md</b> (5 минут, бесплатно).</div>'
          : "") +
        '<div class="card"><div class="card-body stack" id="statsBody"><p class="muted">Загружаем данные…</p></div></div>' +
        '<div class="row"><button class="btn btn-ghost btn-sm" type="button" data-act="stats-reload">Обновить</button>' +
        '<a class="btn btn-ghost btn-sm" href="#/">На главную</a></div>' +
        "</section>",
      mount: function (root) {
        loadStats();
        root.addEventListener("click", function (e) {
          var t = e.target.closest("[data-act]");
          if (t && t.getAttribute("data-act") === "stats-reload") loadStats();
        });
      }
    };
  }

  /* ---------- роутер ---------- */
  function route(soft) {
    var raw = location.hash.replace(/^#/, "");
    var path = (raw.split("?")[0] || "/").replace(/\/+$/, "") || "/";
    var scrollY = window.scrollY;

    var stage = path === "/game" ? 1 : path === "/quiz" ? 2 : path === "/collage" ? 3 : 0;

    if (stage && !S.isUnlocked(stage)) {
      window.toast("Сначала пройди предыдущий этап");
      var back = stage === 2 ? "#/game" : stage === 3 ? "#/quiz" : "#/";
      if (location.hash !== back) location.hash = back;
      return;
    }

    var screen;
    if (path === "/game") screen = Screens.game();
    else if (path === "/quiz") screen = Screens.quiz();
    else if (path === "/collage") screen = Screens.collage();
    else if (path === "/stats") screen = statsScreen();
    else if (path === "/finish") screen = finishScreen();
    else screen = startScreen();

    var fresh = app.cloneNode(false);
    app.replaceWith(fresh);
    app = fresh;
    app.innerHTML = typeof screen.html === "function" ? screen.html() : (screen.html || "");
    if (screen.mount) screen.mount(app);

    renderSteps(path);
    window.scrollTo(0, soft ? scrollY : 0);
  }

  window.rerender = function () { route(true); };

  window.addEventListener("hashchange", function () { route(false); });

  document.getElementById("resetBtn").addEventListener("click", function () {
    if (!window.confirm("Начать квест заново? Прогресс, отделение и фото будут удалены.")) return;
    S.reset();
    if (window.PhotoDB) window.PhotoDB.clear();
    location.hash = "#/";
    route();
    window.toast("Начинаем заново");
  });

  route();
})();

</script>
</body>
</html>
